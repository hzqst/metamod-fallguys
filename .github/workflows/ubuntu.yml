name: ubuntu

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Debug, Release]
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      
      - name: Install build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential gcc gcc-multilib g++-multilib
      
      - name: Build all
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cmake -S . -B build/x86/${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build/x86/${{ matrix.config }} --parallel 6
          cmake --install build/x86/${{ matrix.config }}

      - name: Stage release payload
        if: matrix.config == 'Release'
        run: cmake -E copy_directory install/x86/Release/addons "${{ runner.temp }}/mmfg-release/build/addons"

      - name: Archive the install payload
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ github.workspace }}/metamod-fallguys-ubuntu-i386.zip'
          directory: '${{ runner.temp }}/mmfg-release'
          path: 'build'

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && matrix.config == 'Release'
        with:
          name: metamod-fallguys-${{ github.ref }}
          files: |
            metamod-fallguys-ubuntu-i386.zip
