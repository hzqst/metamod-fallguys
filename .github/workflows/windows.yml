name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-2022
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build all
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          cmake -S . -B build-cmake/native -A Win32
          cmake --build build-cmake/native --config ${{ matrix.config }} --parallel 6
          cmake --install build-cmake/native --config ${{ matrix.config }} --prefix build

      - name: Verify component PDBs
        working-directory: ${{env.GITHUB_WORKSPACE}}
        shell: pwsh
        run: |
          $pdbDirectory = Join-Path $env:GITHUB_WORKSPACE 'build\addons\metamod\dlls'
          $expectedPdbs = @(
            'metamod.pdb',
            'asext.pdb',
            'fallguys.pdb',
            'ascurl.pdb',
            'asqcvar.pdb',
            'asusermsg.pdb'
          )

          $missingPdbs = @()
          foreach ($pdb in $expectedPdbs) {
            if (-not (Test-Path (Join-Path $pdbDirectory $pdb))) {
              $missingPdbs += $pdb
            }
          }

          if ($missingPdbs.Count -gt 0) {
            throw "Missing component PDBs: $($missingPdbs -join ', ')"
          }

      - name: Archive the build directory 
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: 'metamod-fallguys-windows-x86.zip'
          path: 'build'
          recursive_exclusions: '*.pdb'

      - name: Archive the build directory with PDBs
        if: matrix.config == 'Release'
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: 'metamod-fallguys-windows-x86-with-pdb.zip'
          path: 'build'

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && matrix.config == 'Release'
        with:
          name: metamod-fallguys-${{ github.ref }}
          files: |
            metamod-fallguys-windows-x86.zip
            metamod-fallguys-windows-x86-with-pdb.zip
