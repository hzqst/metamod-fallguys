name: clang-format
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==23.1.3
      - run: cmake -S . -B build-cmake/format -DFORMAT_VALIDATION_ONLY=ON
      - run: cmake --build build-cmake/format --target format-check
